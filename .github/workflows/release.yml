name: Release desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS
            target: universal-apple-darwin
          - os: windows-latest
            platform: Windows
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install universal macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Build installers
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri -- build --target ${{ matrix.target }}
      - name: Verify and collect macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ROOT=release/tauri-target/universal-apple-darwin/release/bundle
          APP="$ROOT/macos/LLM Usage Bar.app"
          codesign --verify --deep --strict "$APP"
          lipo "$APP/Contents/MacOS/llm-usage-bar" -verify_arch arm64 x86_64
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "$APP" release-assets/LLM-Usage-Bar-macOS-universal.zip
          cp "$ROOT"/dmg/*.dmg release-assets/LLM-Usage-Bar-macOS-universal.dmg
      - name: Install and smoke test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/tauri-target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | Select-Object -First 1
          $installDirectory = Join-Path $env:RUNNER_TEMP 'llm-release-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDirectory") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $executable = Join-Path $installDirectory 'llm-usage-bar.exe'
          if (-not (Test-Path $executable)) { throw "Installed executable missing: $executable" }
          node scripts/smoke-desktop.mjs $executable
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke test failed' }
      - name: Collect Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force
          Copy-Item release/tauri-target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe release-assets/LLM-Usage-Bar-Windows-x64-setup.exe
          Copy-Item release/tauri-target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi release-assets/LLM-Usage-Bar-Windows-x64.msi
      - uses: actions/upload-artifact@v7
        with:
          name: llm-usage-bar-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: llm-usage-bar-*
          merge-multiple: true
          path: release-assets
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.dmg *.zip *.exe *.msi > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: LLM Usage Bar ${{ github.ref_name }}
          draft: true
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          fail_on_unmatched_files: true
